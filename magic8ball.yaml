esphome:
  name: magic8ball
  friendly_name: Magic8Ball
  platformio_options:
    board_build.flash_mode: dio
  libraries:
    - Wire
    - SPI
    - SensorLib@0.2.1

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Magic8Ball Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password

# ---------------- Backlight / screen power (GPIO40) ----------------
# We use this instead of display.enable_pin so we can turn it on/off with actions.
switch:
  - platform: gpio
    id: screen_power
    name: "Screen Power (BL)"
    pin:
      number: GPIO40
      mode: OUTPUT
      inverted: false        # if screen stays dark, try true
    restore_mode: ALWAYS_ON  # boot with screen ON

